<!--
HTML Structure for Responsive Sidebar
Description: A responsive sidebar that collapses on desktop and converts to a top bar on mobile
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Meta tags for character set and viewport settings -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Page title -->
  <title>Task1|Sidebar</title>
  <!-- Link to external stylesheets -->
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

  <!-- Sidebar container with toggle functionality -->
  <div class="sidebar" id="sidebar">
    <div>
      <!-- Top section containing logo and toggle button -->
      <div class="top-section">
        <div class="logo">
          <!-- Logo image from assets folder -->
          <img src="./Assets/logo.png" alt="Logo" class="logo-img">
          <!-- Logo text placeholder -->
          <span class="logo-text">GDGoC</span>
        </div>
        <!-- Toggle button for sidebar collapse/expansion -->
        <button class="toggle-btn" id="toggleBtn">
          <i class="fas fa-bars"></i>
        </button>
      </div>

      <!-- Navigation menu items -->
      <nav>
        <!-- Active navigation item (Dashboard) -->
        <div class="nav-item active">
          <i class="fas fa-home"></i>
          <span class="nav-text">Dashboard</span>
        </div>

        <!-- Profile navigation item -->
        <div class="nav-item">
          <i class="fas fa-user"></i>
          <span class="nav-text">Profile</span>
        </div>

        <!-- Projects navigation item -->
        <div class="nav-item">
          <i class="fas fa-folder"></i>
          <span class="nav-text">Projects</span>
        </div>

        <!-- Settings navigation item -->
        <div class="nav-item">
          <i class="fas fa-cog"></i>
          <span class="nav-text">Settings</span>
        </div>

        <!-- Logout navigation item -->
        <div class="nav-item">
          <i class="fas fa-right-from-bracket"></i>
          <span class="nav-text">Logout</span>
        </div>
      </nav>
    </div>
  </div>

  <!-- Main content area that adjusts based on sidebar state -->
  <div class="main-content">
    Main Content Area
  </div>

  <!-- Link to JavaScript file for interactivity -->
  <script src="script.js"></script>
</body>
</html>
